scraper:
  hashtags:
    - "#nifty50"
    - "#sensex"
    - "#intraday"
    - "#banknifty"
  target_tweets: 2000
  max_scroll_attempts: 500
  headless: false
  window_size: [1366, 900]
  page_load_timeout: 30
  scroll_pause_range: [1.5, 3.5]
  # How often (every N scroll iterations) to check for a rate-limit/anti-bot
  # page. Checking every iteration was the biggest per-scroll time cost (it
  # dumps X's entire DOM to a string); a real rate-limit page persists for
  # many iterations once it appears, so a less frequent check barely delays
  # detection while meaningfully speeding up the overall run.
  rate_limit_check_interval: 4
  rate_limit:
    max_actions_per_window: 30
    window_seconds: 60
    backoff_base_seconds: 5
    backoff_max_seconds: 300
  # Required: path to a Chrome profile you've already logged into X with
  # manually (a normal, human login - not via this scraper). The scraper
  # reuses that profile's session instead of automating the login form
  # itself, which is the step most likely to trip X's anti-automation
  # detection. See README.md "Login setup" for the one-time setup steps.
  user_data_dir: "D:\\SeleniumProfile"
  profile_directory: ""
storage:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  sample_dir: "data/sample"
  parquet_compression: "snappy"

processing:
  bloom_filter:
    capacity: 200000
    error_rate: 0.001
  near_duplicate_threshold: 0.6

analysis:
  tfidf:
    max_features: 5000
    ngram_range: [1, 2]
    min_df: 2
  bullish_lexicon:
    - "breakout"
    - "buy"
    - "upper circuit"
    - "rally"
    - "bullish"
    - "long"
    - "target hit"
    - "support held"
    - "strong"
  bearish_lexicon:
    - "breakdown"
    - "sell"
    - "lower circuit"
    - "crash"
    - "bearish"
    - "short"
    - "stop loss hit"
    - "resistance"
    - "panic"
  confidence_level: 0.95
  bootstrap_samples: 500

logging:
  level: "INFO"
  file: "logs/app.log"
